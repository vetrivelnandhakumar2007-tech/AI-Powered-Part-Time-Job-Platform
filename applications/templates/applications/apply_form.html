{% extends "base.html" %}
{% block title %}Apply — {{ job.title }}{% endblock %}
{% block content %}
<div class="row justify-content-center">
<div class="col-md-6">
    <h2 class="mb-1">Apply to {{ job.title }}</h2>
    <p class="text-muted mb-4">{{ job.location }} &middot; ₹{{ job.pay_rate }} ({{ job.get_pay_type_display }})</p>
    <form method="post" class="form-spacious">
        {% csrf_token %}
        {% for field in form %}
        <div class="mb-3">
            <label class="form-label">{{ field.label }}</label>
            {{ field }}
        </div>
        {% endfor %}
        <button class="btn btn-info text-white" type="submit">Submit Application</button>
    </form>
</div>
</div>
{% endblock %}
