{% extends "adminpanel/base_admin.html" %}
{% block title %}Confirm Delete{% endblock %}
{% block page_title %}Confirm Delete{% endblock %}
{% block admin_content %}
<div class="admin-panel" style="max-width:480px;">
    <p>Are you sure you want to delete <strong>{{ label }}</strong>? This cannot be undone.</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit" class="admin-btn admin-btn-delete" style="padding:0.55rem 1.1rem; font-size:0.95rem;">Yes, delete</button>
        <a href="{% url cancel_url %}" class="btn btn-ghost-jla">Cancel</a>
    </form>
</div>
{% endblock %}
