{% extends "adminpanel/base_admin.html" %}
{% block title %}Edit Job{% endblock %}
{% block page_title %}Edit Job — {{ obj.title }}{% endblock %}
{% block admin_content %}
<div class="admin-panel" style="max-width:640px;">
    <form method="post">
        {% csrf_token %}
        {% for field in form %}
        <div class="mb-3">
            <label class="form-label">{{ field.label }}</label>
            {{ field }}
        </div>
        {% endfor %}
        <button class="btn btn-primary-jla" type="submit">Save Changes</button>
        <a href="{% url 'adminpanel:job_list' %}" class="btn btn-ghost-jla">Cancel</a>
    </form>
</div>
{% endblock %}
